services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://fastapi_user:FastAPI123@postgres:5432/fastapi_db"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: FastAPI123
      POSTGRES_DB: fastapi_db
    ports:
      - "5433:5432"
