name: FastAPI Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, fastapi]
   
    env:
      DATABASE_URL: postgresql://fastapi_user:FastAPI123@localhost:5433/fastapi_test_db
      TEST_DATABASE_URL: postgresql://fastapi_user:FastAPI123@localhost:5433/fastapi_test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Install dependencies
        run: |
          source /home/maheshwar/FastAPI-Project/venv/bin/activate
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          source /home/maheshwar/FastAPI-Project/venv/bin/activate
          python -m pytest -v

      - name: Restart FastAPI
        run: |
          sudo systemctl restart fastapi
          sudo systemctl status fastapi --no-pager

      - name: Verify FastAPI
        run: |
          curl --fail http://127.0.0.1:8000/docs
